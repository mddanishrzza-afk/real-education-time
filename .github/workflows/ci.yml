name: quality-and-migrations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      APP_URL: http://localhost:3000
      AI_PROVIDER: LOCAL_GROUNDED
      ENABLE_DEMO_LOGIN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ret
          POSTGRES_PASSWORD: ret_test_password
          POSTGRES_DB: ret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ret -d ret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ret:ret_test_password@localhost:5432/ret?schema=public
      DIRECT_URL: postgresql://ret:ret_test_password@localhost:5432/ret?schema=public
      APP_URL: http://localhost:3000
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate:production
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:production
      - run: npx prisma migrate status --schema prisma/schema.prisma
